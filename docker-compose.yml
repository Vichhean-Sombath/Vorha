services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vorha
      MYSQL_USER: vorha
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vorha_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vorha_root_dev_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-vorha_root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: Vorha
      ENVIRONMENT: development
      DATABASE_URL: mysql+pymysql://vorha:${MYSQL_PASSWORD:-vorha_dev_password}@mysql:3306/vorha?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only-change-before-deploying}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
      AUDIO_CACHE_DIR: /app/.audio-cache
    ports:
      - "8000:8000"
    volumes:
      - audio_cache:/app/.audio-cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  audio_cache:
